[project]
name = "pixeltable-chess-broadcast-scenes"
version = "0.1.0"
description = "Turn chess tournament broadcast recordings into scenes, keyframes, per-shot frames, the final board of every game and highlight clips, with every step a Pixeltable computed column or view - built with Pixeltable"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Pierre Brunelle" }]
keywords = ["pixeltable", "multimodal", "ai", "computed-columns", "data-infrastructure", "chess-broadcast-scenes"]
dependencies = [
    "pixeltable>=0.7.21",
    "pillow",
    "av",
    "numpy",
    "scenedetect>=0.6",
    "opencv-python-headless",
]

[project.urls]
Homepage = "https://pixeltable.com"
Documentation = "https://docs.pixeltable.com"
Pixeltable = "https://github.com/pixeltable/pixeltable"
